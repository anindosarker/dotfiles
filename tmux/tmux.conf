set -g mouse on

setw -g mode-keys vi

# resize with Ctrl+b Shift+H/J/K/L
bind -r H resize-pane -L 5
bind -r L resize-pane -R 5
bind -r K resize-pane -U 5
bind -r J resize-pane -D 5

# plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @plugin 'Determinant/tmux-colortag'
set -g @continuum-restore 'on'
set -g @resurrect-capture-pane-contents 'on'

# colortag: plain separators, color only the window tabs
TMUX_COLORTAG_USE_POWERLINE=no
TMUX_COLORTAG_TAG_ONLY=yes
TMUX_COLORTAG_TAG_BOLD=yes

# name windows by pane title (Claude Code sets it to the conversation topic),
# else by the running program. Session name already shows the folder.
set -g allow-rename off
setw -g automatic-rename on
setw -g automatic-rename-format '#{?#{||:#{==:#{pane_title},#{host}},#{m:*@*,#{pane_title}}},#{pane_current_command},#{=20:#{s/^[^A-Za-z0-9]+ //:pane_title}}}'
set -g status-left-length 40

run '~/.tmux/plugins/tpm/tpm'

# colortag: prefix y cycles the current window to the next color (repeatable)
bind -r y run-shell "~/.tmux/plugins/tmux-colortag/name2color.py '#S' #I '#W' --cycle >/dev/null 2>&1; tmux refresh-client -S"
# colortag: prefix Y (shift+y) cycles back to the previous color
bind -r Y run-shell "~/.tmux/plugins/tmux-colortag/name2color.py '#S' #I '#W' --cycle=-1 >/dev/null 2>&1; tmux refresh-client -S"

# colortag tabs: [ name ] with the brackets in the window's color.
# current window = full color brackets + bright bold name on a soft (--alpha 0.4) background inside the brackets,
# other windows = no brackets, number and name in the faded color (--alpha). Must stay after the tpm run line.
set -g window-status-separator ''
set -g window-status-style default
set -g window-status-current-style default
set -g window-status-format "#[fg=#(~/.tmux/plugins/tmux-colortag/name2color.py '#S' #I '#W' --alpha 0.5),bg=default,nobold]   #I|#W   #[default]"
set -g window-status-current-format "#[default] #[fg=#(~/.tmux/plugins/tmux-colortag/name2color.py '#S' #I '#W'),bg=#(~/.tmux/plugins/tmux-colortag/name2color.py '#S' #I '#W' --alpha 0.4),bold][ #[fg=colour255]#I|#W #[fg=#(~/.tmux/plugins/tmux-colortag/name2color.py '#S' #I '#W')]]#[default] "

# send "session · window" as the terminal title (VS Code shows it as the tab
# name with "terminal.integrated.tabs.title": "${sequence}")
set -g set-titles on
set -g set-titles-string "#S · #W"

# Claude Code teammates: when a teammate pane opens (its command has --agent-id),
# keep the main agent as a wide left pane (70%) and stack teammates on the right.
# Delayed so it runs after Claude Code's own split sizing.
set -g main-pane-width 70%
set-hook -g after-split-window 'if -F "#{m:*--agent-id*,#{pane_start_command}}" "run-shell -b \"sleep 0.5; tmux select-layout -t #{window_id} main-vertical\""'
