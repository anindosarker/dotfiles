set -g mouse on

setw -g mode-keys vi

# resize with Ctrl+b Shift+H/J/K/L
bind -r H resize-pane -L 5
bind -r L resize-pane -R 5
bind -r K resize-pane -U 5
bind -r J resize-pane -D 5

# plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @plugin 'Determinant/tmux-colortag'
set -g @continuum-restore 'on'
set -g @resurrect-capture-pane-contents 'on'

# colortag: plain separators, color only the window tabs
TMUX_COLORTAG_USE_POWERLINE=no
TMUX_COLORTAG_TAG_ONLY=yes
TMUX_COLORTAG_TAG_BOLD=yes

# name windows by pane title (Claude Code sets it to the conversation topic),
# else by the running program. Session name already shows the folder.
set -g allow-rename off
setw -g automatic-rename on
setw -g automatic-rename-format '#{?#{||:#{==:#{pane_title},#{host}},#{m:*@*,#{pane_title}}},#{pane_current_command},#{=20:#{s/^[^A-Za-z0-9]+ //:pane_title}}}'
set -g status-left-length 40

run '~/.tmux/plugins/tpm/tpm'

# colortag: prefix y cycles the current window to the next color (repeatable)
bind -r y run-shell "~/.tmux/plugins/tmux-colortag/name2color.py '#S' #I '#W' --cycle >/dev/null 2>&1; ~/.dotfiles/tmux/status-tint.sh '#{session_id}'; tmux refresh-client -S"
# colortag: prefix Y (shift+y) cycles back to the previous color
bind -r Y run-shell "~/.tmux/plugins/tmux-colortag/name2color.py '#S' #I '#W' --cycle=-1 >/dev/null 2>&1; ~/.dotfiles/tmux/status-tint.sh '#{session_id}'; tmux refresh-client -S"

# colortag tabs: [ name ] with the brackets in the window's color.
# current window = full color brackets + black bold name on a strong (--alpha 0.65) background inside the brackets,
# other windows = no brackets, number and name in the window color at 80% (--alpha 0.8). Must stay after the tpm run line.
set -g window-status-separator ''
set -g window-status-style default
set -g window-status-current-style default
set -g window-status-format "#[fg=#(~/.tmux/plugins/tmux-colortag/name2color.py '#S' #I '#W' --alpha 0.8),bg=default,nobold]   #I|#W   #[default]"
set -g window-status-current-format "#[default] #[fg=#(~/.tmux/plugins/tmux-colortag/name2color.py '#S' #I '#W'),bg=#(~/.tmux/plugins/tmux-colortag/name2color.py '#S' #I '#W' --alpha 0.65),bold][ #[fg=#11111b]#I|#W #[fg=#(~/.tmux/plugins/tmux-colortag/name2color.py '#S' #I '#W')]]#[default] "

# send "session · window" as the terminal title (VS Code shows it as the tab
# name with "terminal.integrated.tabs.title": "${sequence}")
set -g set-titles on
set -g set-titles-string "#S · #W"

# Claude Code teammates: when a teammate pane opens (its command has --agent-id),
# keep the main agent as a wide left pane (70%) and stack teammates on the right.
# set -g main-pane-width 70%
# Claude Code resizes the panes itself after it opens a teammate, so react to
# its split/select-layout/resize; the script only acts when the main pane is under 60%.
set-hook -g after-split-window "run-shell -b '~/.dotfiles/tmux/teammate-layout.sh #{window_id} settle'"
set-hook -g after-select-layout "run-shell -b '~/.dotfiles/tmux/teammate-layout.sh #{window_id}'"
set-hook -g after-resize-pane "run-shell -b '~/.dotfiles/tmux/teammate-layout.sh #{window_id}'"

# status bar tinted with 10% of the current window's color (per session)
set -g status-style "bg=#1e1e2e,fg=#cdd6f4"
set-hook -g session-window-changed "run-shell -b '~/.dotfiles/tmux/status-tint.sh #{session_id}'"
set-hook -g client-session-changed "run-shell -b '~/.dotfiles/tmux/status-tint.sh #{session_id}'"
set-hook -g after-new-window "run-shell -b '~/.dotfiles/tmux/status-tint.sh #{session_id}'"
set-hook -g window-renamed "run-shell -b '~/.dotfiles/tmux/status-tint.sh #{session_id}'"
run-shell -b '~/.dotfiles/tmux/status-tint.sh all'
